<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>สรุปการใช้รถรายปี — IT Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ===== Palette: Soft Sand (เหมือนหน้าบันทึกการใช้รถ) ===== */
  --ink:#faf8f5; --panel:#ffffff; --line:#eee9e1;
  --tx:#2e2a24; --tx2:#6f675c; --tx3:#a39a8d;
  --amber:#8a6a4a; --amber-ink:#ffffff;
  --bad:#b3462b;
  --r1:18px; --r2:14px; --r3:11px;
  --sans:'Prompt',sans-serif;
  --mono:'JetBrains Mono','Prompt',monospace;   /* JetBrains Mono ไม่มีอักษรไทย → ตัวไทย (ทะเบียน, กม.) ใช้ Prompt แทน */
  /* สีประจำรถแต่ละคัน (ตรวจตาบอดสีแล้ว) — สีตามรถเสมอ ไม่เปลี่ยนตามลำดับ */
  --s-a:#2a78d6;   /* 3ฒษ-7643 */
  --s-b:#eb6834;   /* 3ฒภ-8066 */
  --s-o:#1baf7a;   /* คันอื่นๆ */
  /* สีสถานะ ใช้คู่กับไอคอน+ข้อความเสมอ */
  --st-crit:#d03b3b; --st-warn:#fab219; --st-info:#a39a8d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);overflow-x:hidden}
body{padding-bottom:80px}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
button:active{opacity:.8}
a{color:inherit}
.mono{font-family:var(--mono)}
.ic{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-0.14em;flex-shrink:0}
.page{width:100%;max-width:760px;margin:0 auto}

/* ---------- Header ---------- */
.hero{background:var(--panel);padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.hero-in{max-width:724px;margin:0 auto}  /* ให้ขอบซ้ายตรงกับการ์ดด้านล่าง (760 − ขอบ 18×2) */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.eyebrow .ic{width:12px;height:12px}
.hero h1{font-size:19px;font-weight:600;margin:6px 48px 2px 0}
.hero-links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px}
.hero-links a{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);text-decoration:none}
.hero-links .ic{width:12px;height:12px}

/* ---------- Controls ---------- */
.controls{padding:14px 18px 0;display:flex;flex-direction:column;gap:10px}
.year-nav{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:6px 8px}
.year-nav button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.year-nav button:hover:not(:disabled){background:var(--line)}
.year-nav button:disabled{opacity:.3;cursor:default}
.year-nav .lbl{flex:1;text-align:center;font-size:14px;font-weight:600}
.year-nav .lbl small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--tx3);margin-left:6px}
.plate-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.plate-row::-webkit-scrollbar{display:none}
.pchip{flex-shrink:0;display:flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 12px;border-radius:var(--r3);border:1px solid var(--line);color:var(--tx2);background:var(--panel);white-space:nowrap}
.pchip.active{border-color:var(--amber);color:var(--tx);font-weight:500}
.pchip .n{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.sw{width:9px;height:9px;border-radius:3px;flex-shrink:0;display:inline-block}

/* ---------- Sections ---------- */
.sec{margin:14px 18px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:14.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:7px}
.sec-h h2 .ic{width:15px;height:15px;color:var(--tx3)}
.sec-h .sub{font-size:11px;color:var(--tx3);text-align:right}
.muted{color:var(--tx3)}
.note{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:10px}

/* แบนเนอร์เตือนข้อมูล */
.check-banner{margin:14px 18px 0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--tx2);line-height:1.55;cursor:pointer;text-align:left;width:calc(100% - 36px)}
.check-banner .ic{width:16px;height:16px;color:var(--st-crit);margin-top:2px}
.check-banner b{color:var(--tx)}
.check-banner .go{margin-left:auto;align-self:center;color:var(--amber);white-space:nowrap;font-size:12px}

/* Hero figure + tiles */
.hero-fig{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.hero-fig .v{font-size:48px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero-fig .u{font-size:14px;color:var(--tx2);padding-bottom:6px}
.hero-sub{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.6}
.cover{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden;max-width:320px}
.cover i{display:block;height:100%;background:var(--amber);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}
@media (min-width:620px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;min-width:0;background:var(--ink)}
.tile .l{font-size:11px;color:var(--tx3);line-height:1.35}
.tile .v{font-size:20px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.tile .d{font-size:10.5px;color:var(--tx3);margin-top:2px}

/* รถแต่ละคัน */
.share{display:flex;gap:2px;height:8px;margin:2px 0 14px}
.share i{display:block;height:100%;border-radius:4px;min-width:2px}
.plate-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.plate-item:first-of-type{border-top:none;padding-top:2px}
.plate-item .sw{margin-top:6px}
.plate-item .main{flex:1;min-width:0}
.plate-item .nm{font-size:14px;font-weight:600;font-family:var(--mono)}
.plate-item .meta{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.55}
.plate-item .warn{font-size:11px;color:var(--tx3);margin-top:3px;display:flex;gap:4px;align-items:center}
.plate-item .warn .ic{width:11px;height:11px;color:var(--st-warn)}
.plate-item .km{text-align:right;flex-shrink:0}
.plate-item .km b{display:block;font-size:17px;font-weight:600}
.plate-item .km span{font-size:10.5px;color:var(--tx3)}
.plate-item.sel .nm{color:var(--amber)}

/* มาก/น้อยสุด */
.ext{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (max-width:420px){ .ext{grid-template-columns:minmax(0,1fr)} }
.ext-item{border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;background:var(--ink);min-width:0}
.ext-item .l{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.ext-item .l .tag{font-size:9.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--tx2);background:var(--panel)}
.ext-item .v{font-size:17px;font-weight:600;margin-top:4px}
.ext-item .v small{font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.ext-item .d{font-size:11.5px;color:var(--tx2);margin-top:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ext-item a{color:var(--amber);text-decoration:none;font-size:11px}

/* ---------- Chart ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-2px 0 10px;font-size:11.5px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{font-family:var(--mono);font-size:10px;fill:var(--tx3);font-variant-numeric:tabular-nums}
.chart .xl text{font-size:10.5px;fill:var(--tx2)}
.chart .xl text.cur{fill:var(--tx);font-weight:600}
.chart .cap{font-family:var(--mono);font-size:10.5px;fill:var(--tx);font-weight:600}
.chart .hit{fill:transparent;cursor:pointer}
.chart .col{transition:opacity .2s ease}
.chart .col.dim{opacity:.35}
/* แท่งกราฟงอกขึ้นจากฐาน + ตัวเลขค่อยๆ โผล่ (เฉพาะตอนเปิดหน้า/เปลี่ยนปี/เปลี่ยนรถ ไม่เล่นซ้ำตอนย่อขยายจอ) */
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes capIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chart.grow .col{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow .6s cubic-bezier(.32,.72,0,1) both}
.chart.grow .caps text{animation:capIn .35s ease both;animation-delay:.6s}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(46,42,36,.12);padding:9px 11px;font-size:11.5px;min-width:150px;z-index:5;display:none}
.tip.show{display:block}
.tip .t{font-weight:600;margin-bottom:5px;font-size:12px}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--tx2);line-height:1.7}
.tip .r b{margin-left:auto;color:var(--tx);font-family:var(--mono);font-weight:600;padding-left:10px}
.tip .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}

/* ---------- Tables ---------- */
.tbl-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-size:10.5px;color:var(--tx3);font-weight:500;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom;line-height:1.3}
td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx)}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);position:sticky;left:0;background:var(--panel);z-index:1}
tr.future td{color:var(--tx3)}
tr.empty td{color:var(--tx3)}
tfoot td{font-weight:700;border-bottom:none;border-top:1px solid var(--tx3)}
td .mk{display:inline-flex;align-items:center;gap:3px;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--tx2);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:5px;vertical-align:1px}
td.dimtxt{color:var(--tx3)}
td .sub{display:block;font-size:10px;color:var(--tx3);font-weight:400}
.yr-row td:first-child{font-weight:600}
.yr-row.sel td{background:var(--ink)}
.yr-row.sel td:first-child{background:var(--ink)}

/* ---------- Data check ---------- */
.chk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chk-chips button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r3);border:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--tx2)}
.chk-chips button.active{border-color:var(--amber);color:var(--tx);font-weight:500}
.chk-chips .n{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.lvl{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--tx2);background:var(--panel);white-space:nowrap}
.lvl .ic{width:11px;height:11px}
.lvl.error .ic{color:var(--st-crit)}
.lvl.warn .ic{color:var(--st-warn)}
.lvl.info .ic{color:var(--st-info)}
.chk-item{display:block;padding:11px 0;border-top:1px solid var(--line);text-decoration:none}
.chk-item:first-child{border-top:none;padding-top:0}
.chk-item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk-item .ttl{font-size:13px;font-weight:500;color:var(--tx)}
.chk-item .msg{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.55}
.chk-item .trip{font-size:11px;color:var(--tx3);margin-top:3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk-acts{display:flex;gap:8px;margin-top:8px}
.chk-acts a{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--ink);font-size:11.5px;color:var(--tx2);text-decoration:none}
.chk-acts a.edit{border-color:var(--amber);color:var(--amber);background:var(--panel)}
.chk-acts .ic{width:12px;height:12px}
.chk-ok{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
.more-btn{display:block;width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r3);background:var(--ink);font-size:12.5px;color:var(--tx2)}

/* มีแถบเมนูด้านบน (ui.js) แล้ว: หัวข้อ + ลิงก์ย้ายไปอยู่ในแถบ/เมนู ☰ */
html.has-uibar .hero{display:none}
/* แต่ละส่วนค่อยๆ เลื่อนขึ้นมาทีละส่วน */
@keyframes secUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#report.anim > *{animation:secUp .5s cubic-bezier(.32,.72,0,1) both}
#report.anim > *:nth-child(2){animation-delay:50ms}#report.anim > *:nth-child(3){animation-delay:100ms}#report.anim > *:nth-child(4){animation-delay:150ms}
#report.anim > *:nth-child(5){animation-delay:200ms}#report.anim > *:nth-child(n+6){animation-delay:250ms}
@media (prefers-reduced-motion: reduce){#report.anim > *,.chart.grow .col,.chart.grow .caps text{animation:none}}
details.howto{margin:14px 18px 0;font-size:12px;color:var(--tx2);line-height:1.7}
details.howto summary{cursor:pointer;color:var(--tx3);font-size:12px;padding:6px 0}
details.howto ul{margin:6px 0 0;padding-left:18px}

/* ---------- Loading / error ---------- */
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 25%,var(--ink) 37%,var(--line) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;margin:10px 0}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.err{text-align:center;padding:40px 20px;color:var(--tx2);font-size:13px;line-height:1.7}
.err button{margin-top:12px;padding:10px 18px;border-radius:var(--r3);background:var(--amber);color:var(--amber-ink);font-size:13px}
</style>
<script src="ui.js"></script>  <!-- แถบเมนู ☰ + อนิเมชันเลื่อนขึ้นลง (ต้องอยู่หลัง <style> ของหน้า) -->
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="eyebrow"><svg class="ic" id="icEyebrow"></svg>IT DEPARTMENT · FLEET REPORT</div>
    <h1>สรุปการใช้รถรายปี</h1>
    <div class="hero-links">
      <a href="index.html"><svg class="ic" id="icBack"></svg>กลับหน้าหลัก</a>
      <a href="vehicle-log-v3.html"><svg class="ic" id="icLog"></svg>ไปหน้าบันทึกการใช้รถ</a>
    </div>
  </div>
</div>

<div class="page">
  <div class="controls">
    <div class="year-nav">
      <button id="prevYear" title="ปีก่อนหน้า" aria-label="ปีก่อนหน้า"><svg class="ic" id="icPrev"></svg></button>
      <span class="lbl" id="yearLabel">-</span>
      <button id="nextYear" title="ปีถัดไป" aria-label="ปีถัดไป"><svg class="ic" id="icNext"></svg></button>
    </div>
    <div class="plate-row" id="plateSeg"></div>
  </div>

  <div id="report">
    <div class="sec"><div class="sk" style="width:40%"></div><div class="sk" style="height:40px;width:60%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>
    <div class="sec"><div class="sk" style="width:30%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>
  </div>
</div>

<script>

function svgIc(name, style){ return `<svg class="ic" viewBox="0 0 24 24"${style?` style="${style}"`:''}>${ic(name)}</svg>`; }

/* ====== ตั้งค่า ====== */
const CONFIG = { API_URL: 'https://vehiclelog.mobile1234.site' };
const PLATES = { A: '3ฒษ-7643', B: '3ฒภ-8066' };   // ต้องตรงกับหน้าบันทึกการใช้รถ
const LONG_TRIP_KM = 1000;   // ทริปเดียวเกินนี้ = ให้ตรวจสอบเลขไมค์
const GAP_KM = 50;           // ไมค์ขาดช่วงจากทริปก่อนหน้าเกินนี้ = อาจมีการใช้รถที่ไม่ได้บันทึก
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let trips = [];
let year = null;
let plateFilter = 'ALL';
let issueFilter = 'ALL';
let issueShowAll = false;
let animateNext = true;   // false = วาดใหม่แบบไม่เล่นอนิเมชัน (กดตัวกรองในส่วนตรวจข้อมูล)

/* ---------- วันที่ (ใช้เวลาเครื่อง ไม่ใช่ UTC) ---------- */
const pad2 = n => String(n).padStart(2,'0');
function localISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
const TODAY = localISO(new Date());
const [TY, TM, TD] = TODAY.split('-').map(Number);
const daysIn = (y,m) => new Date(y, m, 0).getDate();
// จำนวนวันปฏิทินที่ "ผ่านมาแล้ว" ของเดือนนั้น (เดือนปัจจุบันนับถึงวันนี้ / เดือนในอนาคต = 0)
function elapsedDays(y,m){
  if(y<TY || (y===TY && m<TM)) return daysIn(y,m);
  if(y===TY && m===TM) return TD;
  return 0;
}
function thDate(iso){ if(!iso) return '-'; const [y,m,d]=iso.split('-').map(Number); return `${d} ${THAI_MONTHS_SHORT[m-1]} ${String(y+543).slice(-2)}`; }
const beYear = y => y + 543;

/* ---------- ตัวเลข ---------- */
const fmtInt = n => Math.round(n).toLocaleString('en-US');
function fmtAvg(n){ if(n==null || !isFinite(n)) return '–'; return n >= 100 ? fmtInt(n) : n.toLocaleString('en-US',{minimumFractionDigits:1, maximumFractionDigits:1}); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- ทริป ---------- */
const plateKey = t => (t.Plate || '').trim();
const plateName = k => PLATES[k] || k || 'ไม่ระบุทะเบียน';
const seriesOf = k => k==='A' ? 'a' : k==='B' ? 'b' : 'o';
const seriesColor = s => `var(--s-${s})`;
const SERIES_NAME = { a: PLATES.A, b: PLATES.B, o: 'คันอื่นๆ' };
const hasNum = v => v!==null && v!==undefined && v!=='' && !isNaN(Number(v));
// ระยะทางของทริป = ไมค์สิ้นสุด − ไมค์เริ่ม (นับเฉพาะทริปที่จบแล้ว และเลขไมค์ครบ+ไม่ติดลบ)
function dist(t){
  if(t.Status==='in_progress') return null;
  if(!hasNum(t.MileageStart) || !hasNum(t.MileageEnd)) return null;
  const d = Number(t.MileageEnd) - Number(t.MileageStart);
  return d >= 0 ? d : null;
}
const destOf = t => [t.DestCode, t.DestName].filter(Boolean).join(' - ') || 'ไม่ระบุปลายทาง';
const tripLink = t => `vehicle-log-v3.html?trip=${encodeURIComponent(t.ID)}`;
const yearOf = t => Number((t.OutDate||'').slice(0,4));
const monthOf = t => Number((t.OutDate||'').slice(5,7));

function aggregate(list){
  const kmTrips = list.filter(t=>dist(t)!=null);
  const km = kmTrips.reduce((s,t)=>s+dist(t),0);
  const pos = kmTrips.filter(t=>dist(t)>0);
  const byDay = {};
  kmTrips.forEach(t=>{ byDay[t.OutDate] = (byDay[t.OutDate]||0) + dist(t); });
  let maxDay = null;
  Object.entries(byDay).forEach(([d,v])=>{ if(v>0 && (!maxDay || v>maxDay.km)) maxDay = {date:d, km:v}; });
  return {
    trips: list.length, kmTrips: kmTrips.length, km,
    daysOut: new Set(list.map(t=>t.OutDate)).size,
    kmDays: new Set(kmTrips.map(t=>t.OutDate)).size,
    minTrip: pos.length ? pos.reduce((a,b)=>dist(b)<dist(a)?b:a) : null,
    maxTrip: pos.length ? pos.reduce((a,b)=>dist(b)>dist(a)?b:a) : null,
    maxDay,
  };
}

/* ============================================================
   ตรวจความถูกต้องของข้อมูล — ทุกทริป ทุกปี
   ============================================================ */
const ISSUE_TYPES = {
  negative: { level:'error', label:'ไมค์ติดลบ' },
  backward: { level:'error', label:'ไมค์ย้อนกลับ' },
  missing:  { level:'warn',  label:'ไม่มีเลขไมค์' },
  long:     { level:'warn',  label:'ระยะทางสูงผิดปกติ' },
  stale:    { level:'warn',  label:'ทริปยังไม่กดจบ' },
  indate:   { level:'warn',  label:'วันที่กลับก่อนวันออก' },
  future:   { level:'warn',  label:'วันที่อยู่ในอนาคต' },
  noplate:  { level:'warn',  label:'ไม่ระบุทะเบียน' },
  dup:      { level:'warn',  label:'อาจบันทึกซ้ำ' },
  gap:      { level:'info',  label:'ไมค์ขาดช่วง' },
  zero:     { level:'info',  label:'ระยะทาง 0 กม.' },
};
const LEVEL = { error:{label:'ผิดพลาด', icon:'triangle-warning'}, warn:{label:'ควรตรวจ', icon:'triangle-warning'}, info:{label:'ข้อสังเกต', icon:'info'} };
const LEVEL_ORDER = { error:0, warn:1, info:2 };

function findIssues(all){
  const out = [];
  const add = (type, t, msg) => out.push({ type, level: ISSUE_TYPES[type].level, trip: t, msg });
  const n = v => fmtInt(Number(v));
  all.forEach(t=>{
    const done = t.Status !== 'in_progress';
    if(!plateKey(t)) add('noplate', t, 'ทริปนี้ไม่ได้ระบุทะเบียนรถ จึงไม่ถูกนับรวมกับรถคันใด');
    if(done && (!hasNum(t.MileageStart) || !hasNum(t.MileageEnd))) add('missing', t, 'ไม่มีเลขไมค์เริ่มหรือสิ้นสุด — ทริปนี้ไม่ถูกนับระยะทาง');
    if(hasNum(t.MileageStart) && hasNum(t.MileageEnd) && Number(t.MileageEnd) < Number(t.MileageStart))
      add('negative', t, `ไมค์สิ้นสุด ${n(t.MileageEnd)} น้อยกว่าไมค์เริ่ม ${n(t.MileageStart)} — อาจกรอกสลับหรือพิมพ์ผิด ไม่ถูกนับระยะทาง`);
    const d = dist(t);
    if(d!=null && d > LONG_TRIP_KM) add('long', t, `ทริปเดียววิ่ง ${n(d)} กม. (${n(t.MileageStart)} → ${n(t.MileageEnd)}) — ถ้าไม่ได้ไปต่างจังหวัดจริงให้ตรวจเลขไมค์ (ยังนับรวมอยู่)`);
    if(d===0) add('zero', t, `ไมค์เริ่มและสิ้นสุดเท่ากัน (${n(t.MileageStart)})`);
    if(!done && t.OutDate && t.OutDate < TODAY) add('stale', t, `เริ่มทริปตั้งแต่ ${thDate(t.OutDate)} แต่ยังไม่กดจบ — ทริปนี้ยังไม่ถูกนับในสรุป`);
    if(t.InDate && t.OutDate && t.InDate < t.OutDate) add('indate', t, `วันที่กลับ (${thDate(t.InDate)}) อยู่ก่อนวันที่ออก (${thDate(t.OutDate)})`);
    if(t.OutDate && t.OutDate > TODAY) add('future', t, `วันที่ออกเดินทาง ${thDate(t.OutDate)} ยังมาไม่ถึง`);
  });
  // ซ้ำ: รถคันเดียวกัน วันเดียวกัน เลขไมค์เริ่ม-สิ้นสุดเหมือนกันทุกตัว
  const seen = {};
  all.forEach(t=>{
    if(!hasNum(t.MileageStart) || !hasNum(t.MileageEnd)) return;
    const k = [plateKey(t), t.OutDate, t.MileageStart, t.MileageEnd].join('|');
    if(seen[k]) add('dup', t, `ข้อมูลเหมือนทริป #${seen[k].ID} ทุกอย่าง (วันที่ รถ และเลขไมค์) — ถ้าบันทึกซ้ำให้ลบอันใดอันหนึ่ง`);
    else seen[k] = t;
  });
  // ความต่อเนื่องของเลขไมค์: เรียงทริปของรถแต่ละคันตามวันที่ แล้วเทียบไมค์เริ่มกับไมค์สิ้นสุดของทริปก่อนหน้า
  const byPlate = {};
  all.forEach(t=>{ const k=plateKey(t); if(k && hasNum(t.MileageStart)) (byPlate[k] = byPlate[k] || []).push(t); });
  Object.values(byPlate).forEach(list=>{
    list.sort((a,b)=>(a.OutDate||'').localeCompare(b.OutDate||'') || (Number(a.ID)||0)-(Number(b.ID)||0));
    let prev = null;
    list.forEach(t=>{
      if(prev){
        const diff = Number(t.MileageStart) - Number(prev.MileageEnd);
        if(diff < 0) add('backward', t, `ไมค์เริ่ม ${n(t.MileageStart)} ต่ำกว่าไมค์สิ้นสุดของทริปก่อนหน้า (#${prev.ID} วันที่ ${thDate(prev.OutDate)} = ${n(prev.MileageEnd)}) — วันที่หรือเลขไมค์ของทริปใดทริปหนึ่งน่าจะกรอกผิด`);
        else if(diff > GAP_KM) add('gap', t, `ไมค์เริ่ม ${n(t.MileageStart)} ห่างจากไมค์สิ้นสุดของทริปก่อนหน้า (#${prev.ID} วันที่ ${thDate(prev.OutDate)} = ${n(prev.MileageEnd)}) ${n(diff)} กม. — อาจมีการใช้รถที่ไม่ได้บันทึก`);
      }
      // ทริปที่ไมค์ติดลบ/ไม่มีไมค์สิ้นสุด ไม่ใช้เป็นจุดอ้างอิงของทริปถัดไป
      if(hasNum(t.MileageEnd) && Number(t.MileageEnd) >= Number(t.MileageStart)) prev = t;
    });
  });
  return out;
}

/* ============================================================
   Render
   ============================================================ */
function yearsAvailable(){
  const ys = new Set(trips.map(yearOf).filter(Boolean));
  ys.add(TY);
  return [...ys].sort((a,b)=>a-b);
}
function platesInYear(y){
  // นับเฉพาะทริปที่จบแล้ว (ให้ตรงกับตัวเลขในหน้า) แต่ยังโชว์รถที่มีแค่ทริปที่กำลังเดินทางอยู่ด้วย
  const cnt = {};
  trips.filter(t=>yearOf(t)===y).forEach(t=>{ const k=plateKey(t); cnt[k]=(cnt[k]||0)+(t.Status!=='in_progress'?1:0); });
  const order = k => k==='A'?0 : k==='B'?1 : k===''?3 : 2;
  return Object.keys(cnt).sort((a,b)=>order(a)-order(b) || cnt[b]-cnt[a]).map(k=>({k, n:cnt[k]}));
}
const matchPlate = t => plateFilter==='ALL' || plateKey(t)===plateFilter;

function syncUrl(){
  const p = new URLSearchParams();
  p.set('year', year);
  if(plateFilter!=='ALL') p.set('plate', plateFilter);
  try{ history.replaceState(null, '', '?' + p.toString()); }catch(e){}
}

function render(){
  const years = yearsAvailable();
  document.getElementById('yearLabel').innerHTML = `ปี ${beYear(year)}<small>ค.ศ. ${year}</small>`;
  document.getElementById('prevYear').disabled = year <= years[0];
  document.getElementById('nextYear').disabled = year >= years[years.length-1];

  const plates = platesInYear(year);
  if(plateFilter!=='ALL' && !plates.some(p=>p.k===plateFilter)) plateFilter = 'ALL';
  const seg = document.getElementById('plateSeg');
  seg.innerHTML = `<button class="pchip${plateFilter==='ALL'?' active':''}" data-i="-1">ทุกคัน</button>` +
    plates.map((p,i)=>`<button class="pchip${plateFilter===p.k?' active':''}" data-i="${i}"><span class="sw" style="background:${seriesColor(seriesOf(p.k))}"></span>${escapeHtml(plateName(p.k))}<span class="n">${p.n}</span></button>`).join('');
  seg.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ const i=Number(b.dataset.i); plateFilter = i<0 ? 'ALL' : plates[i].k; issueShowAll=false; syncUrl(); render(); };
  });
  syncUrl();

  // ----- ข้อมูลปีนี้ -----
  const yearAll = trips.filter(t=>yearOf(t)===year);
  const yearDone = yearAll.filter(t=>t.Status!=='in_progress');
  const sel = yearDone.filter(matchPlate);
  const agg = aggregate(sel);
  const months = [];
  for(let m=1;m<=12;m++){
    const list = sel.filter(t=>monthOf(t)===m);
    const a = aggregate(list);
    const byS = {a:0,b:0,o:0};
    list.forEach(t=>{ const d=dist(t); if(d!=null) byS[seriesOf(plateKey(t))] += d; });
    months.push({ m, ...a, byS, cal: elapsedDays(year,m) });
  }
  const calYear = months.reduce((s,x)=>s+x.cal,0);
  const monthsElapsed = months.filter(x=>x.cal>0).length;
  const issues = findIssues(trips).filter(i=>yearOf(i.trip)===year && matchPlate(i.trip));
  const nErr = issues.filter(i=>i.level==='error').length, nWarn = issues.filter(i=>i.level==='warn').length;

  let html = '';
  if(nErr + nWarn > 0){
    html += `<button class="check-banner" id="toCheck">${svgIc('triangle-warning')}<span>พบข้อมูลที่ควรตรวจสอบ <b>${nErr+nWarn} รายการ</b>${nErr?` (ผิดพลาด ${nErr})`:''} — ตัวเลขในหน้านี้นับเฉพาะทริปที่เลขไมค์ครบและถูกต้อง</span><span class="go">ดูรายการ ›</span></button>`;
  }

  // ----- 1) ภาพรวมทั้งปี -----
  const scopeName = plateFilter==='ALL' ? 'ทุกคัน' : plateName(plateFilter);
  const coverPct = agg.trips ? Math.round(agg.kmTrips/agg.trips*100) : 0;
  html += `<section class="sec">
    <div class="sec-h"><h2>${svgIc('tachometer-fast')}ระยะทางรวมปี ${beYear(year)}</h2><span class="sub">${escapeHtml(scopeName)}</span></div>
    ${agg.trips===0 ? `<div class="muted" style="font-size:13px">ไม่มีการใช้รถในปีนี้</div>` : `
    <div class="hero-fig"><span class="v">${fmtInt(agg.km)}</span><span class="u">กม.</span></div>
    <div class="hero-sub">${fmtInt(agg.trips)} เที่ยว · ออกรถ ${fmtInt(agg.daysOut)} วัน · มีเลขไมค์ครบ ${fmtInt(agg.kmTrips)} เที่ยว (${coverPct}%)</div>
    <div class="cover" title="สัดส่วนทริปที่มีเลขไมค์ครบ"><i style="width:${coverPct}%"></i></div>
    <div class="tiles">
      <div class="tile"><div class="l">เฉลี่ยต่อวัน<br>(วันปฏิทิน)</div><div class="v">${calYear?fmtAvg(agg.km/calYear):'–'}<small>กม.</small></div><div class="d">หาร ${fmtInt(calYear)} วัน</div></div>
      <div class="tile"><div class="l">เฉลี่ยต่อวัน<br>(เฉพาะวันที่ออกรถ)</div><div class="v">${agg.kmDays?fmtAvg(agg.km/agg.kmDays):'–'}<small>กม.</small></div><div class="d">หาร ${fmtInt(agg.kmDays)} วัน</div></div>
      <div class="tile"><div class="l">เฉลี่ยต่อเดือน<br>&nbsp;</div><div class="v">${monthsElapsed?fmtAvg(agg.km/monthsElapsed):'–'}<small>กม.</small></div><div class="d">หาร ${monthsElapsed} เดือน</div></div>
      <div class="tile"><div class="l">เฉลี่ยต่อเที่ยว<br>&nbsp;</div><div class="v">${agg.kmTrips?fmtAvg(agg.km/agg.kmTrips):'–'}<small>กม.</small></div><div class="d">หาร ${fmtInt(agg.kmTrips)} เที่ยว</div></div>
    </div>`}
  </section>`;

  // ----- 2) ใช้รถทะเบียนอะไรบ้าง -----
  const plateRows = plates.map(p=>{
    const list = yearDone.filter(t=>plateKey(t)===p.k);
    const a = aggregate(list);
    const dates = list.map(t=>t.OutDate).sort();
    return { ...p, a, first: dates[0], last: dates[dates.length-1], open: yearAll.filter(t=>plateKey(t)===p.k && t.Status==='in_progress').length };
  });
  const totKm = plateRows.reduce((s,p)=>s+p.a.km,0);
  html += `<section class="sec">
    <div class="sec-h"><h2>${svgIc('car-alt')}ปี ${beYear(year)} ใช้รถ ${plateRows.length} คัน</h2><span class="sub">แตะเพื่อดูเฉพาะคัน</span></div>
    ${totKm>0 ? `<div class="share" role="img" aria-label="สัดส่วนระยะทางแต่ละคัน">${plateRows.filter(p=>p.a.km>0).map(p=>`<i style="flex:${p.a.km};background:${seriesColor(seriesOf(p.k))}" title="${escapeHtml(plateName(p.k))} ${fmtInt(p.a.km)} กม. (${Math.round(p.a.km/totKm*100)}%)"></i>`).join('')}</div>` : ''}
    ${plateRows.length===0 ? '<div class="muted" style="font-size:13px">ไม่มีการใช้รถในปีนี้</div>' : plateRows.map((p,i)=>`
      <button class="plate-item${plateFilter===p.k?' sel':''}" data-i="${i}">
        <span class="sw" style="background:${seriesColor(seriesOf(p.k))}"></span>
        <span class="main">
          <span class="nm">${escapeHtml(plateName(p.k))}</span>
          <span class="meta" style="display:block">${fmtInt(p.a.trips)} เที่ยว · ออกรถ ${fmtInt(p.a.daysOut)} วัน${p.a.kmTrips?` · เฉลี่ย ${fmtAvg(p.a.km/p.a.kmTrips)} กม./เที่ยว · ${fmtAvg(p.a.km/p.a.kmDays)} กม./วันที่ออกรถ`:''}<br>ใช้ครั้งแรก ${thDate(p.first)} · ล่าสุด ${thDate(p.last)}</span>
          ${p.a.trips-p.a.kmTrips>0 ? `<span class="warn">${svgIc('triangle-warning')}ไม่มีเลขไมค์ ${p.a.trips-p.a.kmTrips} เที่ยว (ไม่ถูกนับระยะทาง)</span>` : ''}
          ${p.open ? `<span class="warn">${svgIc('clock-three')}กำลังเดินทาง/ยังไม่กดจบ ${p.open} ทริป</span>` : ''}
        </span>
        <span class="km mono"><b>${p.a.kmTrips?fmtInt(p.a.km):'–'}</b><span>${p.a.kmTrips?`กม.${totKm?` · ${Math.round(p.a.km/totKm*100)}%`:''}`:'ไม่มีไมค์'}</span></span>
      </button>`).join('')}
  </section>`;

  // ----- 3) มากสุด / น้อยสุด -----
  const usedMonths = months.filter(x=>x.kmTrips>0);
  const maxM = usedMonths.length ? usedMonths.reduce((a,b)=>b.km>a.km?b:a) : null;
  const minM = usedMonths.length ? usedMonths.reduce((a,b)=>b.km<a.km?b:a) : null;
  const idleMonths = months.filter(x=>x.cal>0 && x.trips===0);
  const tripDesc = t => `${thDate(t.OutDate)} · ${escapeHtml(plateName(plateKey(t)))} · ${escapeHtml(destOf(t))}`;
  if(agg.kmTrips>0){
    html += `<section class="sec">
      <div class="sec-h"><h2>${svgIc('route')}มากสุด / น้อยสุด</h2><span class="sub">${escapeHtml(scopeName)}</span></div>
      <div class="ext">
        <div class="ext-item"><div class="l"><span class="tag">สูงสุด</span>เดือนที่ใช้มากสุด</div><div class="v">${fmtInt(maxM.km)}<small>กม.</small></div><div class="d">${THAI_MONTHS[maxM.m-1]} · ${maxM.trips} เที่ยว · เฉลี่ย ${maxM.kmDays?fmtAvg(maxM.km/maxM.kmDays):'–'} กม./วันที่ออกรถ</div></div>
        <div class="ext-item"><div class="l"><span class="tag">ต่ำสุด</span>เดือนที่ใช้น้อยสุด</div><div class="v">${fmtInt(minM.km)}<small>กม.</small></div><div class="d">${THAI_MONTHS[minM.m-1]} · ${minM.trips} เที่ยว${usedMonths.length===1?' · มีข้อมูลไมค์แค่เดือนเดียว':''}</div></div>
        ${agg.maxDay ? `<div class="ext-item"><div class="l"><span class="tag">สูงสุด</span>วันที่ใช้มากสุด</div><div class="v">${fmtInt(agg.maxDay.km)}<small>กม.</small></div><div class="d">${thDate(agg.maxDay.date)} · ${sel.filter(t=>t.OutDate===agg.maxDay.date && dist(t)!=null).length} เที่ยว</div></div>` : ''}
        <div class="ext-item"><div class="l"><span class="tag">ว่าง</span>เดือนที่ไม่ได้ใช้รถ</div><div class="v">${idleMonths.length}<small>เดือน</small></div><div class="d">${idleMonths.length ? idleMonths.map(x=>THAI_MONTHS_SHORT[x.m-1]).join(', ') : 'มีการใช้รถทุกเดือน'}</div></div>
        ${agg.maxTrip ? `<div class="ext-item"><div class="l"><span class="tag">สูงสุด</span>ทริปที่ไกลที่สุด</div><div class="v">${fmtInt(dist(agg.maxTrip))}<small>กม.</small></div><div class="d">${tripDesc(agg.maxTrip)}</div><a href="${tripLink(agg.maxTrip)}">เปิดทริป #${agg.maxTrip.ID} ›</a></div>` : ''}
        ${agg.minTrip ? `<div class="ext-item"><div class="l"><span class="tag">ต่ำสุด</span>ทริปที่ใกล้ที่สุด</div><div class="v">${fmtInt(dist(agg.minTrip))}<small>กม.</small></div><div class="d">${tripDesc(agg.minTrip)}</div><a href="${tripLink(agg.minTrip)}">เปิดทริป #${agg.minTrip.ID} ›</a></div>` : ''}
      </div>
      <div class="note">“เดือนที่ใช้น้อยสุด” เทียบเฉพาะเดือนที่มีข้อมูลเลขไมค์ · ทริปที่ใกล้ที่สุดไม่นับทริป 0 กม.</div>
    </section>`;
  }

  // ----- 4) กราฟรายเดือน -----
  const seriesUsed = ['a','b','o'].filter(s=>months.some(x=>x.byS[s]>0));
  if(agg.kmTrips>0){
    html += `<section class="sec">
      <div class="sec-h"><h2>${svgIc('calendar-day')}ระยะทางรายเดือน (กม.)</h2><span class="sub">${escapeHtml(scopeName)} · ปี ${beYear(year)}</span></div>
      ${seriesUsed.length>1 ? `<div class="legend">${seriesUsed.map(s=>`<span><i class="sw" style="background:${seriesColor(s)}"></i>${SERIES_NAME[s]}</span>`).join('')}</div>` : ''}
      <div class="chart" id="chart"></div>
    </section>`;
  }

  // ----- 5) ตารางรายเดือน -----
  if(agg.trips>0){
    html += `<section class="sec">
      <div class="sec-h"><h2>${svgIc('calendar-day')}รายเดือน</h2><span class="sub">เลื่อนซ้าย-ขวาได้</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>เดือน</th><th>เที่ยว</th><th>วัน<br>ออกรถ</th><th>กม.รวม</th><th>เฉลี่ย/วัน<br>(ปฏิทิน)</th><th>เฉลี่ย/วัน<br>(ออกรถ)</th><th>เฉลี่ย<br>/เที่ยว</th><th>ทริป<br>สั้นสุด</th><th>ทริป<br>ไกลสุด</th></tr></thead>
        <tbody>${months.map(x=>{
          const fut = x.cal===0;
          const cls = fut ? 'future' : (x.trips===0 ? 'empty' : '');
          const mk = (maxM && x.m===maxM.m && usedMonths.length>1) ? `<span class="mk">สูงสุด</span>` : (minM && x.m===minM.m && usedMonths.length>1) ? `<span class="mk">ต่ำสุด</span>` : '';
          const cur = (year===TY && x.m===TM) ? ' <span class="muted" style="font-size:10px">(ถึงวันนี้)</span>' : '';
          if(fut || x.trips===0) return `<tr class="${cls}"><td>${THAI_MONTHS_SHORT[x.m-1]}${cur}</td><td>${fut?'':'0'}</td><td></td><td>${fut?'':'–'}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
          const noKm = x.kmTrips===0;
          return `<tr><td>${THAI_MONTHS_SHORT[x.m-1]}${mk}${cur}</td>
            <td>${x.trips}${x.trips>x.kmTrips?`<span class="sub">ไมค์ครบ ${x.kmTrips}</span>`:''}</td>
            <td>${x.daysOut}</td>
            <td${noKm?' class="dimtxt"':''}>${noKm?'ไม่มีไมค์':fmtInt(x.km)}</td>
            <td>${noKm?'–':fmtAvg(x.km/x.cal)}</td>
            <td>${noKm?'–':fmtAvg(x.km/x.kmDays)}</td>
            <td>${noKm?'–':fmtAvg(x.km/x.kmTrips)}</td>
            <td>${x.minTrip?fmtInt(dist(x.minTrip)):'–'}</td>
            <td>${x.maxTrip?fmtInt(dist(x.maxTrip)):'–'}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td>ทั้งปี</td><td>${fmtInt(agg.trips)}</td><td>${fmtInt(agg.daysOut)}</td><td>${fmtInt(agg.km)}</td><td>${calYear?fmtAvg(agg.km/calYear):'–'}</td><td>${agg.kmDays?fmtAvg(agg.km/agg.kmDays):'–'}</td><td>${agg.kmTrips?fmtAvg(agg.km/agg.kmTrips):'–'}</td><td>${agg.minTrip?fmtInt(dist(agg.minTrip)):'–'}</td><td>${agg.maxTrip?fmtInt(dist(agg.maxTrip)):'–'}</td></tr></tfoot>
      </table></div>
      <div class="note">เฉลี่ย/วัน (ปฏิทิน) = กม.รวม ÷ จำนวนวันในเดือน (เดือนปัจจุบันนับถึงวันนี้) · เฉลี่ย/วัน (ออกรถ) = กม.รวม ÷ จำนวนวันที่มีทริปที่มีเลขไมค์</div>
    </section>`;
  }

  // ----- 6) เทียบทุกปี -----
  html += `<section class="sec">
    <div class="sec-h"><h2>${svgIc('route')}เทียบทุกปี</h2><span class="sub">${escapeHtml(scopeName)} · แตะปีเพื่อเปิดดู</span></div>
    <div class="tbl-scroll"><table>
      <thead><tr><th>ปี</th><th>รถที่ใช้</th><th>เที่ยว</th><th>กม.รวม</th><th>เฉลี่ย<br>/เดือน</th><th>เฉลี่ย/วัน<br>(ปฏิทิน)</th><th>ไมค์ครบ</th></tr></thead>
      <tbody>${years.slice().reverse().map(y=>{
        const list = trips.filter(t=>yearOf(t)===y && t.Status!=='in_progress' && matchPlate(t));
        const a = aggregate(list);
        let cal=0, me=0; for(let m=1;m<=12;m++){ const c=elapsedDays(y,m); cal+=c; if(c>0) me++; }
        const nPl = new Set(list.map(plateKey)).size;
        return `<tr class="yr-row${y===year?' sel':''}" data-y="${y}" style="cursor:pointer"><td>${beYear(y)}</td><td>${nPl||'–'}</td><td>${fmtInt(a.trips)}</td><td>${a.kmTrips?fmtInt(a.km):'–'}</td><td>${a.kmTrips&&me?fmtAvg(a.km/me):'–'}</td><td>${a.kmTrips&&cal?fmtAvg(a.km/cal):'–'}</td><td>${a.trips?Math.round(a.kmTrips/a.trips*100)+'%':'–'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="note">ปีที่ “ไมค์ครบ” ต่ำ ตัวเลขระยะทางจะต่ำกว่าความจริง เพราะทริปที่ไม่มีเลขไมค์ไม่ถูกนับ</div>
  </section>`;

  // ----- 7) ตรวจสอบข้อมูล -----
  html += renderIssuesSection(issues);

  html += `<details class="howto"><summary>วิธีคำนวณตัวเลขในหน้านี้</summary><ul>
    <li>ระยะทางของทริป = เลขไมค์สิ้นสุด − เลขไมค์เริ่มต้น นับเฉพาะทริปที่จบแล้ว และเลขไมค์ครบไม่ติดลบ</li>
    <li>นับทริปเข้าเดือน/ปี ตาม “วันที่ออกเดินทาง”</li>
    <li>วันออกรถ = จำนวนวันที่ไม่ซ้ำกันที่มีทริปออก · เฉลี่ยต่อวัน (ออกรถ) ใช้เฉพาะวันที่มีทริปที่มีเลขไมค์</li>
    <li>เฉลี่ยต่อวัน (ปฏิทิน) หารด้วยทุกวันในเดือน/ปี รวมวันที่ไม่ได้ใช้รถ ปีและเดือนปัจจุบันนับถึงวันนี้</li>
    <li>เฉลี่ยต่อเดือน = กม.รวมทั้งปี ÷ จำนวนเดือนที่ผ่านมาแล้วของปีนั้น</li>
    <li>ทริปไกลเกิน ${fmtInt(LONG_TRIP_KM)} กม. ยังนับรวม แต่ขึ้นเตือนให้ตรวจ · ไมค์ขาดช่วงเกิน ${GAP_KM} กม. ขึ้นเป็นข้อสังเกต</li>
  </ul></details>`;

  const box = document.getElementById('report');
  const animate = animateNext; animateNext = true;
  box.classList.toggle('anim', animate);
  box.innerHTML = html;

  const toCheck = document.getElementById('toCheck');
  if(toCheck) toCheck.onclick = ()=>document.getElementById('checkSec').scrollIntoView({behavior:'smooth', block:'start'});
  box.querySelectorAll('.plate-item').forEach(b=>{
    b.onclick = ()=>{ const p = plateRows[Number(b.dataset.i)].k; plateFilter = plateFilter===p ? 'ALL' : p; issueShowAll=false; syncUrl(); render(); window.scrollTo({top:0, behavior:'smooth'}); };
  });
  box.querySelectorAll('.yr-row').forEach(r=>{ r.onclick = ()=>{ year = Number(r.dataset.y); issueShowAll=false; render(); window.scrollTo({top:0, behavior:'smooth'}); }; });
  bindIssues(issues);
  if(agg.kmTrips>0) renderChart(months, seriesUsed, animate);
}

function renderIssuesSection(issues){
  const counts = {};
  issues.forEach(i=>{ counts[i.type] = (counts[i.type]||0)+1; });
  if(issueFilter!=='ALL' && !counts[issueFilter]) issueFilter = 'ALL';
  const types = Object.keys(counts).sort((a,b)=>LEVEL_ORDER[ISSUE_TYPES[a].level]-LEVEL_ORDER[ISSUE_TYPES[b].level] || counts[b]-counts[a]);
  const list = issues.filter(i=>issueFilter==='ALL' || i.type===issueFilter)
    .sort((a,b)=>LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level] || (b.trip.OutDate||'').localeCompare(a.trip.OutDate||''));
  const LIMIT = 15;
  const shown = issueShowAll ? list : list.slice(0, LIMIT);
  let h = `<section class="sec" id="checkSec">
    <div class="sec-h"><h2>${svgIc('triangle-warning')}ตรวจสอบความถูกต้องของข้อมูล</h2><span class="sub">ปี ${beYear(year)} · ${issues.length} รายการ</span></div>`;
  if(!issues.length){
    return h + `<div class="chk-ok">${svgIc('info','width:16px;height:16px;color:var(--s-o)')}ไม่พบข้อมูลผิดปกติในปีนี้</div></section>`;
  }
  h += `<div class="chk-chips" id="chkChips"><button data-t="ALL" class="${issueFilter==='ALL'?'active':''}">ทั้งหมด <span class="n">${issues.length}</span></button>` +
    types.map(t=>`<button data-t="${t}" class="${issueFilter===t?'active':''}"><span class="lvl ${ISSUE_TYPES[t].level}" style="padding:0;border:none;background:none">${svgIc(LEVEL[ISSUE_TYPES[t].level].icon)}</span>${ISSUE_TYPES[t].label} <span class="n">${counts[t]}</span></button>`).join('') + `</div>`;
  h += `<div>${shown.map(i=>{
    const t = i.trip;
    const mile = (hasNum(t.MileageStart)||hasNum(t.MileageEnd)) ? ` · ไมค์ ${hasNum(t.MileageStart)?fmtInt(t.MileageStart):'?'} → ${hasNum(t.MileageEnd)?fmtInt(t.MileageEnd):'?'}` : '';
    return `<div class="chk-item">
      <div class="top"><span class="lvl ${i.level}">${svgIc(LEVEL[i.level].icon)}${LEVEL[i.level].label}</span><span class="ttl">${ISSUE_TYPES[i.type].label}</span></div>
      <div class="msg">${escapeHtml(i.msg)}</div>
      <div class="trip">#${escapeHtml(t.ID)} · ${thDate(t.OutDate)} · ${escapeHtml(plateName(plateKey(t)))} · ${escapeHtml(destOf(t))}${mile}</div>
      <div class="chk-acts">
        <a class="edit" href="${tripLink(t)}&edit=1">${svgIc('pencil')}แก้ไขทริป</a>
        <a href="${tripLink(t)}">${svgIc('route')}ดูรายละเอียด / ลบ</a>
      </div>
    </div>`;
  }).join('')}</div>`;
  if(list.length > LIMIT) h += `<button class="more-btn" id="chkMore">${issueShowAll ? 'ย่อรายการ' : `แสดงทั้งหมด ${list.length} รายการ`}</button>`;
  return h + `</section>`;
}
function bindIssues(){
  const chips = document.getElementById('chkChips');
  if(chips) chips.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ issueFilter = b.dataset.t; issueShowAll=false; rerenderKeepScroll(); }; });
  const more = document.getElementById('chkMore');
  if(more) more.onclick = ()=>{ issueShowAll = !issueShowAll; rerenderKeepScroll(); };
}
function rerenderKeepScroll(){ const y = window.scrollY; animateNext = false; render(); window.scrollTo(0, y); }

/* ============================================================
   กราฟแท่งซ้อน: ระยะทางรายเดือน แยกสีตามรถ
   ============================================================ */
function niceTicks(max){
  if(max<=0) return {step:1, top:1};
  const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(k=>k*p).find(s=>s>=raw);
  return { step, top: Math.ceil(max/step)*step };
}
function tickLabel(v, top){ return top >= 10000 ? (v===0?'0':(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'K') : fmtInt(v); }
function roundTopPath(x, y, w, h, r){
  r = Math.min(r, w/2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
let _chartState = null;
function renderChart(months, seriesUsed, animate){
  _chartState = {months, seriesUsed};
  const wrap = document.getElementById('chart');
  if(!wrap) return;
  const W = Math.max(280, wrap.clientWidth), H = 230;
  _chartState.width = wrap.clientWidth;
  const pad = {l:40, r:6, t:22, b:28};
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const totals = months.map(x=>x.byS.a+x.byS.b+x.byS.o);
  const {step, top} = niceTicks(Math.max(...totals));
  const y = v => pad.t + ih - (v/top)*ih;
  const band = iw/12, bw = Math.min(24, Math.max(8, band*0.62));
  const used = months.map((x,i)=>({i,t:totals[i]})).filter(o=>o.t>0);
  const maxI = used.length ? used.reduce((a,b)=>b.t>a.t?b:a).i : -1;
  const minI = used.length>1 ? used.reduce((a,b)=>b.t<a.t?b:a).i : -1;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="กราฟระยะทางรายเดือน ปี ${beYear(year)} เดือนที่สูงสุด ${maxI>=0?THAI_MONTHS[maxI]+' '+fmtInt(totals[maxI])+' กม.':''}">`;
  s += `<g class="grid">`;
  for(let v=0; v<=top+1e-9; v+=step) s += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)+.5}" y2="${y(v)+.5}"/>`;
  s += `</g><g class="axis">`;
  for(let v=0; v<=top+1e-9; v+=step) s += `<text x="${pad.l-6}" y="${y(v)+3.5}" text-anchor="end">${tickLabel(v, top)}</text>`;
  s += `</g><g class="xl">`;
  months.forEach((x,i)=>{ const cx = pad.l + band*i + band/2; s += `<text x="${cx}" y="${H-9}" text-anchor="middle"${(year===TY && x.m===TM)?' class="cur"':''}>${THAI_MONTHS_SHORT[i]}</text>`; });
  s += `</g>`;
  months.forEach((x,i)=>{
    const cx = pad.l + band*i + band/2, x0 = cx - bw/2;
    let base = 0;
    const segs = seriesUsed.filter(k=>x.byS[k]>0);
    s += `<g class="col" data-i="${i}" style="animation-delay:${i*35}ms">`;
    segs.forEach((k,si)=>{
      const v = x.byS[k];
      const yTop = y(base+v), yBot = y(base);
      const gap = si>0 ? 2 : 0;                 // ช่องว่าง 2px สีพื้นระหว่างชิ้นที่ซ้อนกัน
      const h = Math.max(0, yBot - yTop - gap);
      if(h>0){
        if(si===segs.length-1) s += `<path d="${roundTopPath(x0, yTop, bw, h, 4)}" fill="${seriesColor(k)}"/>`;
        else s += `<rect x="${x0}" y="${yTop}" width="${bw}" height="${h}" fill="${seriesColor(k)}"/>`;
      }
      base += v;
    });
    s += `</g>`;
  });
  // ตัวเลขบนแท่งสูงสุด/ต่ำสุด แยกกลุ่มออกมา (จะได้ไม่ยืดตามแท่งตอนอนิเมชัน)
  s += `<g class="caps">`;
  [maxI, minI].forEach(i=>{ if(i>=0) s += `<text class="cap" x="${pad.l + band*i + band/2}" y="${y(totals[i])-6}" text-anchor="middle">${fmtInt(totals[i])}</text>`; });
  s += `</g>`;
  months.forEach((x,i)=>{ s += `<rect class="hit" data-i="${i}" x="${pad.l+band*i}" y="${pad.t}" width="${band}" height="${ih+pad.b}"/>`; });
  s += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)+.5}" y2="${y(0)+.5}" stroke="var(--tx3)" stroke-width="1"/>`;
  s += `</svg><div class="tip" id="chartTip"></div>`;
  wrap.classList.toggle('grow', !!animate);
  wrap.innerHTML = s;

  const tip = document.getElementById('chartTip');
  const cols = wrap.querySelectorAll('.col');
  const show = (i)=>{
    const x = months[i];
    cols.forEach(c=>c.classList.toggle('dim', Number(c.dataset.i)!==i));
    const rows = seriesUsed.map(k=>`<div class="r"><i class="sw" style="background:${seriesColor(k)}"></i>${SERIES_NAME[k]}<b>${fmtInt(x.byS[k])}</b></div>`).join('');
    tip.innerHTML = `<div class="t">${THAI_MONTHS[i]} ${beYear(year)}</div>` +
      (x.trips===0 ? `<div class="r">${x.cal===0?'ยังไม่ถึงเดือนนี้':'ไม่ได้ใช้รถ'}</div>` :
      (seriesUsed.length>1 ? rows : '') +
      `<div class="r${seriesUsed.length>1?' tot':''}">รวม<b>${fmtInt(totals[i])} กม.</b></div>` +
      `<div class="r">เที่ยว<b>${x.trips}${x.trips>x.kmTrips?` (ไมค์ครบ ${x.kmTrips})`:''}</b></div>` +
      (x.kmDays?`<div class="r">เฉลี่ย/วัน (ปฏิทิน)<b>${fmtAvg(x.km/x.cal)}</b></div><div class="r">เฉลี่ย/วัน (ออกรถ)<b>${fmtAvg(x.km/x.kmDays)}</b></div>`:''));
    tip.classList.add('show');
    const cx = pad.l + band*i + band/2, tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = Math.min(Math.max(0, cx - tw/2), W - tw), topPx = y(totals[i]) - th - 10;
    if(topPx < 0){
      // แท่งสูงจนไม่มีที่ด้านบน → ย้ายไปข้างแท่ง จะได้ไม่บังแท่งที่กำลังดู
      topPx = 0;
      left = (cx + bw/2 + 8 + tw <= W) ? cx + bw/2 + 8 : Math.max(0, cx - bw/2 - 8 - tw);
    }
    tip.style.left = left+'px'; tip.style.top = topPx+'px';
  };
  const hide = ()=>{ tip.classList.remove('show'); cols.forEach(c=>c.classList.remove('dim')); };
  _chartState.hide = hide;
  wrap.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('pointerenter', e=>{ if(e.pointerType==='mouse') show(Number(r.dataset.i)); });
    r.addEventListener('click', ()=>show(Number(r.dataset.i)));
  });
  wrap.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') hide(); });
}
// แตะนอกกราฟ = ซ่อน tooltip (บนมือถือไม่มี hover)
document.addEventListener('click', e=>{
  const wrap = document.getElementById('chart');
  if(_chartState && _chartState.hide && wrap && !wrap.contains(e.target)) _chartState.hide();
});
let _rz;
// วาดกราฟใหม่เฉพาะตอนความกว้างเปลี่ยนจริง (มือถือยิง resize ตอนแถบ URL หด/ขยายขณะเลื่อน ไม่ต้องวาดใหม่ และไม่ตัดอนิเมชันกราฟ)
window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{
  const w = document.getElementById('chart');
  if(_chartState && w && w.clientWidth !== _chartState.width) renderChart(_chartState.months, _chartState.seriesUsed);
}, 150); });

/* ============================================================
   Init
   ============================================================ */
async function load(){
  const box = document.getElementById('report');
  try{
    const r = await fetch(CONFIG.API_URL + '/trips');
    const j = await r.json();
    if(!j.ok) throw new Error('bad response');
    trips = j.data || [];
  }catch(e){
    box.innerHTML = `<div class="err">โหลดข้อมูลทริปไม่ได้ตอนนี้<br>เช็คอินเทอร์เน็ตแล้วลองใหม่<br><button id="retryBtn">ลองใหม่</button></div>`;
    document.getElementById('retryBtn').onclick = load;
    return;
  }
  const qs = new URLSearchParams(location.search);
  const years = yearsAvailable();
  const qy = Number(qs.get('year'));
  year = years.includes(qy) ? qy : TY;
  if(qs.get('plate')!==null) plateFilter = qs.get('plate');
  render();
}

paint('icEyebrow','car-journey');
paint('icBack','arrow-small-left');
paint('icLog','route');
paint('icPrev','arrow-small-left');
paint('icNext','arrow-small-right');
document.getElementById('prevYear').onclick = ()=>{ const ys=yearsAvailable(); const i=ys.indexOf(year); if(i>0){ year=ys[i-1]; issueShowAll=false; render(); } };
document.getElementById('nextYear').onclick = ()=>{ const ys=yearsAvailable(); const i=ys.indexOf(year); if(i<ys.length-1){ year=ys[i+1]; issueShowAll=false; render(); } };
load();
