<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>IT Department — เลือกหน้าที่ต้องการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#faf8f5; --panel:#ffffff; --line:#eee9e1;
  --tx:#2e2a24; --tx2:#6f675c; --tx3:#a39a8d;
  --amber:#8a6a4a; --amber-ink:#ffffff;
  --r1:18px; --r2:16px;
  --sans:'Prompt',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);overflow-x:hidden;min-height:100vh}
body{display:flex;flex-direction:column;align-items:center;padding:0 18px}
.ic{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-0.14em;flex-shrink:0}
.mono{font-family:var(--mono)}
a{text-decoration:none;color:inherit}

.wrap{width:100%;max-width:460px;padding-top:72px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--tx3);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px}
.eyebrow .ic{width:12px;height:12px;color:var(--tx3)}
h1{font-size:23px;font-weight:600;text-align:center;margin:10px 0 2px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--tx3);text-align:center;margin:0 0 46px}

.cards{display:flex;flex-direction:column;gap:18px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:38px 24px;transition:border-color .15s, transform .1s}
.card:active{transform:scale(.985)}
.card:hover{border-color:var(--tx3)}
.card-icon{display:flex;align-items:center;justify-content:center;color:var(--tx);margin-bottom:18px}
.card-icon .ic{width:46px;height:46px}
.card-body h2{font-size:16px;font-weight:600;margin:0 0 5px;color:var(--tx)}
.card-body p{font-size:12.5px;color:var(--tx3);margin:0;line-height:1.5}
.card-arrow{display:none}

.footer-note{margin-top:40px;font-size:11px;color:var(--tx3);text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><svg class="ic" id="icEyebrow"></svg>IT DEPARTMENT</div>
  <h1>เลือกระบบที่ต้องการใช้งาน</h1>
  <p class="sub"></p>

  <div class="cards">
    <a class="card" href="vehicle-log-v3.html">
      <div class="card-icon"><svg class="ic" id="icRoute"></svg></div>
      <div class="card-body">
        <h2>บันทึกการใช้รถ</h2>
        <p>บันทึกทริป · ปฏิทิน · Export ข้อมูล</p>
      </div>
      <div class="card-arrow"><svg class="ic" id="icArrow1"></svg></div>
    </a>

    <a class="card" href="branches-manager.html">
      <div class="card-icon"><svg class="ic" id="icShop"></svg></div>
      <div class="card-body">
        <h2>จัดการข้อมูลสาขา</h2>
        <p>แก้ไขรายชื่อสาขา GD, GHC, ABP, FF</p>
      </div>
      <div class="card-arrow"><svg class="ic" id="icArrow2"></svg></div>
    </a>
  </div>

  <p class="footer-note">ข้อมูลทั้งหมดซิงก์อยู่ในฐานข้อมูลชุดเดียวกัน</p>
</div>
