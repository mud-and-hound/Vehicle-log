<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>จัดการข้อมูลสาขา — IT Department</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4efe6; --panel:#fffdf9; --line:#e6dcc9;
  --tx:#3a2f22; --tx2:#7a6a55; --tx3:#a4927a;
  --amber:#a5643a; --amber-ink:#ffffff; --bad:#b3462b;
  --r1:16px; --r2:12px; --r3:9px;
  --sans:'Prompt',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);overflow-x:hidden}
body{padding-bottom:100px}
@media (min-width:680px){
  body{display:flex;flex-direction:column;align-items:center}
  .hero,.controls,.list,.setup-note{width:100%;max-width:560px}
  .fab{position:fixed}
}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
button:active{opacity:.8}
input,select{font-family:var(--sans);background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;color:var(--tx);font-size:15px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--amber)}
input::placeholder{color:var(--tx3)}
.mono{font-family:var(--mono)}
.ic{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-0.14em;flex-shrink:0}

.hero{background:var(--panel);padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.eyebrow .ic{width:12px;height:12px;color:var(--amber)}
.hero h1{font-size:19px;font-weight:600;margin:6px 0 2px}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);margin-top:8px;text-decoration:none}
.back-link .ic{width:12px;height:12px;transform:rotate(180deg)}
.demo-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--amber);background:rgba(165,100,58,.08);border:1px solid rgba(165,100,58,.3);padding:3px 9px;border-radius:var(--r3);margin-top:8px}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:var(--r2);padding:9px 4px;text-align:center}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:700}
.stat .l{font-size:9px;color:var(--tx3);margin-top:2px}

.controls{padding:14px 18px 0;display:flex;flex-direction:column;gap:10px}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:15px;height:15px}
.search-box input{padding-left:36px}
.brand-tabs{display:flex;gap:6px;overflow-x:auto}
.brand-tabs button{flex:1;padding:8px 6px;border-radius:var(--r3);border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--tx2);white-space:nowrap}
.brand-tabs button.active{border-color:var(--amber);color:var(--amber);font-weight:600}

.list{padding:14px 18px 8px}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl-head{display:grid;grid-template-columns:34px 1fr 42px 60px;gap:8px;padding:9px 12px;font-size:10px;color:var(--tx3);border-bottom:1px solid var(--line)}
.brow{display:grid;grid-template-columns:34px 1fr 42px 60px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);overflow:hidden}
.brow:last-child{border-bottom:none}
.brow-shopid{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.brow-main{overflow:hidden;min-width:0}
.brow-code{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600}
.brow-name{font-size:12px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow-brand{font-size:10.5px;color:var(--tx2);text-align:center}
.brow-actions{display:flex;gap:4px;justify-content:flex-end}
.brow-actions button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.brow-actions button:hover{background:var(--ink)}
.brow-actions .del:hover{color:var(--bad)}
.brow-actions .ic{width:13px;height:13px}

.empty{text-align:center;padding:60px 24px;color:var(--tx3)}
.empty .ic{width:30px;height:30px;opacity:.5;margin-bottom:10px}
.empty b{color:var(--tx2);display:block;margin-bottom:4px;font-size:14px}

.fab{position:fixed;right:18px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;z-index:30}
.fab .ic{width:22px;height:22px}

.overlay{position:fixed;inset:0;background:rgba(58,47,34,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--ink);width:100%;max-width:480px;max-height:92vh;border-radius:18px 18px 0 0;overflow-y:auto;padding:8px 18px 24px;border:1px solid var(--line);border-bottom:none}
.sheet-handle{width:34px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 14px}
.sheet-title{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.sheet-title .ic{width:16px;height:16px;color:var(--amber)}
.sheet-title h2{font-size:16px;margin:0;font-weight:600}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--tx3);margin-bottom:6px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brand-pick{display:flex;gap:8px}
.brand-pick button{flex:1;padding:11px;border-radius:var(--r3);border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--tx2)}
.brand-pick button.sel{border-color:var(--amber);color:var(--amber);font-weight:600}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions button{flex:1;padding:13px;border-radius:var(--r3);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.sheet-actions .ic{width:15px;height:15px}
.btn-cancel{background:var(--panel);color:var(--tx2);border:1px solid var(--line)}
.btn-save{background:var(--amber);color:var(--amber-ink)}
.spin-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-2px;margin-right:2px}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:10px 20px;border-radius:var(--r3);font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

.setup-note{margin:16px 18px 0;padding:12px 14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r2);font-size:11.5px;color:var(--tx3);line-height:1.6}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow"><svg class="ic"></svg>IT DEPARTMENT · BRANCH MASTER DATA</div>
  <h1>จัดการข้อมูลสาขา</h1>
  <a href="index.html" class="back-link"><svg class="ic"></svg>กลับหน้าหลัก</a>
  <span class="demo-badge" id="modeBadge" style="display:none">โหมดตัวอย่าง — ยังไม่เชื่อม Google Sheet</span>
  <div class="stat-row">
    <div class="stat"><div class="v mono" id="statAll">0</div><div class="l">ทั้งหมด</div></div>
    <div class="stat"><div class="v mono" id="statGD">0</div><div class="l">GD</div></div>
    <div class="stat"><div class="v mono" id="statGHC">0</div><div class="l">GHC</div></div>
    <div class="stat"><div class="v mono" id="statABP">0</div><div class="l">ABP</div></div>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <svg class="ic"></svg>
    <input type="text" id="searchInput" placeholder="ค้นหาเลขสาขา, ชื่อย่อ, หรือชื่อเต็ม">
  </div>
  <div class="brand-tabs" id="brandTabs">
    <button data-brand="ALL" class="active">ทั้งหมด</button>
    <button data-brand="GD">GD</button>
    <button data-brand="GHC">GHC</button>
    <button data-brand="ABP">ABP</button>
  </div>
</div>

<div class="list" id="listBox"></div>

<div class="setup-note" id="connNote" style="display:none"></div>

<button class="fab" id="addBtn" title="เพิ่มสาขาใหม่"><svg class="ic"></svg></button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><svg class="ic"></svg><h2 id="sheetTitle">เพิ่มสาขาใหม่</h2></div>
    <form id="branchForm">
      <div class="field">
        <label>แบรนด์</label>
        <div class="brand-pick" id="brandPick">
          <button type="button" data-brand="GD">GD</button>
          <button type="button" data-brand="GHC">GHC</button>
          <button type="button" data-brand="ABP">ABP</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>เลขสาขา (Shop ID)</label><input type="text" id="f_shopId" placeholder="เช่น 0019" required></div>
        <div class="field"><label>ชื่อย่อ (Code)</label><input type="text" id="f_code" placeholder="เช่น CRD" required></div>
      </div>
      <div class="field"><label>ชื่อเต็ม (Name)</label><input type="text" id="f_name" placeholder="เช่น Fashion Island" required></div>
      <div class="sheet-actions">
        <button type="button" class="btn-cancel" id="cancelBtn"><svg class="ic"></svg>ยกเลิก</button>
        <button type="submit" class="btn-save" id="saveBtn"><svg class="ic"></svg>บันทึก</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

  if(isDemo) return BRANCHES;
  const r = await fetch(CONFIG.APPS_SCRIPT_URL + '?action=branches');
  const j = await r.json();
  return j.ok ? j.data.map(b=>({brand:b.Brand, shopId:String(b.ShopID), code:b.Code, name:b.Name})) : [];
}
async function apiAddBranch(payload){
  if(isDemo){ BRANCHES.push(payload); return; }
  await fetch(CONFIG.APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'addBranch', payload:{Brand:payload.brand, ShopID:payload.shopId, Code:payload.code, Name:payload.name}}) });
}
async function apiUpdateBranch(origBrand, origShopId, payload){
  if(isDemo){
    const i = BRANCHES.findIndex(b=>b.brand===origBrand && b.shopId===origShopId);
    if(i>-1) BRANCHES[i] = payload;
    return;
  }
  await fetch(CONFIG.APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'updateBranch', payload:{originalBrand:origBrand, originalShopId:origShopId, Brand:payload.brand, ShopID:payload.shopId, Code:payload.code, Name:payload.name}}) });
}
async function apiDeleteBranch(brand, shopId){
  if(isDemo){ BRANCHES = BRANCHES.filter(b=>!(b.brand===brand && b.shopId===shopId)); return; }
  await fetch(CONFIG.APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'deleteBranch', payload:{Brand:brand, ShopID:shopId}}) });
}

function render(){
  document.getElementById('statAll').textContent = BRANCHES.length.toLocaleString();
  document.getElementById('statGD').textContent = BRANCHES.filter(b=>b.brand==='GD').length.toLocaleString();
  document.getElementById('statGHC').textContent = BRANCHES.filter(b=>b.brand==='GHC').length.toLocaleString();
  document.getElementById('statABP').textContent = BRANCHES.filter(b=>b.brand==='ABP').length.toLocaleString();

  let list = BRANCHES;
  if(curBrand!=='ALL') list = list.filter(b=>b.brand===curBrand);
  if(searchQ){
    const q = searchQ.toLowerCase();
    list = list.filter(b => b.shopId.toLowerCase().includes(q) || b.code.toLowerCase().includes(q) || b.name.toLowerCase().includes(q));
  }
  list = list.slice(0, 300); // กันเรนเดอร์หนักเกินไปตอนค้นหากว้างๆ

  const box = document.getElementById('listBox');
  if(list.length===0){
    box.innerHTML = `<div class="empty"><svg class="ic" viewBox="0 0 24 24">${ic('shop')}</svg><b>ไม่พบสาขาที่ค้นหา</b>ลองคำค้นอื่น หรือกด + เพื่อเพิ่มสาขาใหม่</div>`;
    return;
  }
  box.innerHTML = `<div class="tbl">
    <div class="tbl-head"><span>เลขสาขา</span><span>รหัส - ชื่อ</span><span style="text-align:center">แบรนด์</span><span></span></div>
    ${list.map(b => `
      <div class="brow" data-brand="${escapeHtml(b.brand)}" data-shopid="${escapeHtml(b.shopId)}">
        <span class="brow-shopid">${escapeHtml(b.shopId)}</span>
        <span class="brow-main"><span class="brow-code">${escapeHtml(b.code)}</span> <span class="brow-name">${escapeHtml(b.name)}</span></span>
        <span class="brow-brand">${escapeHtml(b.brand)}</span>
        <span class="brow-actions">
          <button class="edit" title="แก้ไข"><svg class="ic" viewBox="0 0 24 24">${ic('pencil')}</svg></button>
          <button class="del" title="ลบ"><svg class="ic" viewBox="0 0 24 24">${ic('trash')}</svg></button>
        </span>
      </div>`).join('')}
  </div>
  ${BRANCHES.filter(b=>curBrand==='ALL'||b.brand===curBrand).filter(b=>!searchQ || true).length > 300 ? `<div style="text-align:center;font-size:11px;color:var(--tx3);padding:10px">แสดง 300 รายการแรก พิมพ์ค้นหาเพื่อกรองให้แคบลง</div>` : ''}`;

  box.querySelectorAll('.brow .edit').forEach(btn=>{
    btn.onclick = (e)=>{
      const row = e.target.closest('.brow');
      openEdit(row.dataset.brand, row.dataset.shopid);
    };
  });
  box.querySelectorAll('.brow .del').forEach(btn=>{
    btn.onclick = (e)=>{
      const row = e.target.closest('.brow');
      deleteBranch(row.dataset.brand, row.dataset.shopid, btn);
    };
  });
}

function setBrandPick(brand){
  document.querySelectorAll('#brandPick button').forEach(b=>b.classList.toggle('sel', b.dataset.brand===brand));
  document.getElementById('brandPick').dataset.value = brand;
}

function openAdd(){
  editingKey = null;
  document.getElementById('sheetTitle').textContent = 'เพิ่มสาขาใหม่';
  document.getElementById('branchForm').reset();
  setBrandPick('GD');
  document.getElementById('overlay').classList.add('open');
}

function openEdit(brand, shopId){
  const b = BRANCHES.find(x=>x.brand===brand && x.shopId===shopId);
  if(!b) return;
  editingKey = { brand, shopId };
  document.getElementById('sheetTitle').textContent = 'แก้ไขสาขา';
  setBrandPick(b.brand);
  document.getElementById('f_shopId').value = b.shopId;
  document.getElementById('f_code').value = b.code;
  document.getElementById('f_name').value = b.name;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }

async function deleteBranch(brand, shopId, btnEl){
  const b = BRANCHES.find(x=>x.brand===brand && x.shopId===shopId);
  if(!confirm(`ลบสาขา "${b ? b.name : shopId}" ใช่ไหม? กู้คืนไม่ได้`)) return;
  const original = btnEl.innerHTML;
  btnEl.disabled = true; btnEl.innerHTML = '<span class="spin-sm" style="border-top-color:var(--bad);border-color:rgba(179,70,43,.3)"></span>';
  try{
    await apiDeleteBranch(brand, shopId);
    BRANCHES = await apiGetBranches();
    render();
    showToast(`ลบสาขา "${b ? b.name : shopId}" แล้ว`);
  }catch(err){
    showToast('ลบไม่สำเร็จ เช็คการเชื่อมต่อแล้วลองใหม่');
    btnEl.disabled = false; btnEl.innerHTML = original;
  }
}

function paintAllStaticIcons(){
  paintIcon(document.querySelector('.eyebrow .ic'), 'shop');
  paintIcon(document.querySelector('.back-link .ic'), 'route');
  paintIcon(document.querySelector('.search-box .ic'), 'search');
  paintIcon(document.getElementById('addBtn').querySelector('.ic'), 'plus');
  paintIcon(document.querySelector('.sheet-title .ic'), 'shop');
  paintIcon(document.querySelector('#cancelBtn .ic'), 'close');
  paintIcon(document.querySelector('#saveBtn .ic'), 'check');
}

async function init(){
  paintAllStaticIcons();
  document.getElementById('listBox').innerHTML = '<div class="empty">กำลังโหลด...</div>';
  if(isDemo){
    document.getElementById('modeBadge').style.display = 'inline-flex';
  } else {
    try{
      BRANCHES = await apiGetBranches();
      const note = document.getElementById('connNote');
      note.style.display = 'block';
      note.innerHTML = `<b>เชื่อมต่อ Google Sheet เรียบร้อย</b> — ข้อมูลสาขา (${BRANCHES.length.toLocaleString()} รายการ) ซิงก์กับชีตจริงแบบเรียลไทม์`;
    }catch(e){
      showToast('เชื่อมต่อ Google Sheet ไม่ได้ตอนนี้ เช็คอินเทอร์เน็ตแล้วรีเฟรชอีกครั้ง');
    }
  }
  render();

  document.getElementById('addBtn').onclick = openAdd;
  document.getElementById('cancelBtn').onclick = closeSheet;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
  document.getElementById('brandPick').addEventListener('click', (e)=>{ const b=e.target.closest('button'); if(b) setBrandPick(b.dataset.brand); });

  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQ = e.target.value.trim(); render(); });
  document.getElementById('brandTabs').addEventListener('click', (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#brandTabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); curBrand = b.dataset.brand; render();
  });

  document.getElementById('branchForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const brand = document.getElementById('brandPick').dataset.value || 'GD';
    const payload = {
      brand,
      shopId: document.getElementById('f_shopId').value.trim(),
      code: document.getElementById('f_code').value.trim(),
      name: document.getElementById('f_name').value.trim(),
    };
    if(!payload.shopId || !payload.code || !payload.name){ showToast('กรอกข้อมูลให้ครบก่อนนะ'); return; }

    const dup = BRANCHES.find(b => b.brand===payload.brand && b.shopId===payload.shopId &&
      !(editingKey && editingKey.brand===payload.brand && editingKey.shopId===payload.shopId));
    if(dup){ showToast(`เลขสาขา ${payload.shopId} มีอยู่แล้วในแบรนด์ ${payload.brand}`); return; }

    const saveBtn = document.getElementById('saveBtn');
    const orig = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spin-sm"></span> กำลังบันทึก...';
    try{
      if(editingKey){ await apiUpdateBranch(editingKey.brand, editingKey.shopId, payload); }
      else{ await apiAddBranch(payload); }
      BRANCHES = await apiGetBranches();
      render();
      closeSheet();
      showToast(editingKey ? `แก้ไขสาขา "${payload.name}" แล้ว` : `เพิ่มสาขา "${payload.name}" แล้ว`);
    }catch(err){
      showToast('บันทึกไม่สำเร็จ เช็คการเชื่อมต่อแล้วลองใหม่');
    }
    saveBtn.disabled = false;
    saveBtn.innerHTML = orig;
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
